kiss_icp_node:
  ros__parameters:
    base_frame: base_link
    lidar_odom_frame: odom
    publish_odom_tf: true
    invert_odom_tf: true
    publish_debug_clouds: false
    data:
      deskew: false
      max_range: 100.0
      min_range: 0.0
    mapping:
      voxel_size: 1.0
      max_points_per_voxel: 20
    adaptive_threshold:
      initial_threshold: 2.0
      min_motion_th: 0.1
    registration:
      max_num_iterations: 500
      convergence_criterion: 0.0001
      max_num_threads: 0