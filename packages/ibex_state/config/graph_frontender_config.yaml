graph_frontender:
  ros__parameters:
    wheelbase: 1.2          # TODO: set to IBEX's actual wheelbase (m)

    primary_period_s: 0.167   # ~6 Hz backbone timer

    output_topic: "graph_pose"
    lidar_odom_topic: "/kiss/odometry"
    # ouster_imu_topic: "/ouster/imu"
    # insta_imu_topic: "/insta360/imu"
    # gps_topic: "/gps/fix"

    enable_lidar: true
    enable_IMUs: true
    enable_NHC: true
    enable_rate: true
    enable_gps: true

    enable_debugging: true

    prior_noise_std: 0.001
    dyn_noise_std: [0.005, 0.005, 1.0, 1.0, 1.0, 0.001]
    lidar_noise_std: [0.05, 0.05, 0.05, 0.02, 0.02, 0.02]
    lidar_drift_prior_std: [0.01, 0.01, 0.01, 0.005, 0.005, 0.005]
    lidar_drift_process_noise_std: [0.01, 0.01, 0.01, 0.005, 0.005, 0.005]
    residual_prop_noise_std: [0.01, 0.01, 1.0, 1.0, 1.0, 0.01]
    gps_prop_noise_std: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
    nhc_noise_std: [0.001, 0.001]
    rate_prior_std: [1.0, 1.0]
    rate_process_noise_std: [0.5, 0.5]
    rate_tie_noise_std: [0.01, 0.01]
    gps_noise_std: [1.5, 1.5, 3.0]
    lag_seconds: 5.0
    init_velocity_noise_std: 1.0
    fallback_vel_noise_std: 5.0

    imu_ouster_gyro_noise_std: 0.01
    imu_ouster_accel_noise_std: 0.05
    imu_ouster_integration_noise_std: 0.0001
    imu_ouster_gyro_bias_walk_std: 0.0005
    imu_ouster_accel_bias_walk_std: 0.001

    imu_insta_gyro_noise_std: 0.01
    imu_insta_accel_noise_std: 0.05
    imu_insta_integration_noise_std: 0.0001
    imu_insta_gyro_bias_walk_std: 0.0005
    imu_insta_accel_bias_walk_std: 0.001